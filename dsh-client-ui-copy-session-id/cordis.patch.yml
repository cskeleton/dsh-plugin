# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile <name> add link:<repo>` or the Plugins page in the GUI.
- insert:
    - id: ui-copy-session-id
      name: 'dsh-client-ui-copy-session-id'
